# Colors
primary="#004CFF"

# Terminal
set -g default-terminal "tmux-256color"
# Enable truecolor (RGB) for all terminals
set -ga terminal-overrides ",*:RGB"

# Status bar
set -g status-position top
set -g status-justify absolute-centre
set -g status-left "#S"
set -g status-left-length 100
set -g status-right ""
set -g status-style "bg=default"

# Styles
set -g message-style "fg=${primary},bg=default"
set -g mode-style "fg=${primary}"
set -g pane-border-style "fg=default"
set -g pane-active-border-style "fg=default"

# Indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Mouse and clipboard
set -g mouse on
set -g set-clipboard on

# Cursor
set -g cursor-style blinking-bar

# Prefix (C-b -> C-a)
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation (Alt + hjkl, no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Copy mode (vi keys)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Keep the selection after releasing the mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Window switching (Alt + number, no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Splits (open in current directory)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
